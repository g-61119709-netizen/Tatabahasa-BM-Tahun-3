        // Web Audio API Synthesizer Engine (Built-in sounds)
        const AudioEngine = {
            ctx: null,
            muted: false,
            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            },
            playCorrect() {
                if (this.muted) return;
                this.init();
                const now = this.ctx.currentTime;
                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, now + idx * 0.07);
                    gain.gain.setValueAtTime(0.15, now + idx * 0.07);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.07 + 0.2);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now + idx * 0.07);
                    osc.stop(now + idx * 0.07 + 0.22);
                });
            },
            playIncorrect() {
                if (this.muted) return;
                this.init();
                const now = this.ctx.currentTime;
                const notes = [220, 185];
                notes.forEach((freq, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(freq, now + idx * 0.12);
                    gain.gain.setValueAtTime(0.18, now + idx * 0.12);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.12 + 0.22);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now + idx * 0.12);
                    osc.stop(now + idx * 0.12 + 0.25);
                });
            },
            playFanfare() {
                if (this.muted) return;
                this.init();
                const now = this.ctx.currentTime;
                const melody = [
                    { f: 523.25, d: 0.15 },
                    { f: 659.25, d: 0.15 },
                    { f: 783.99, d: 0.15 },
                    { f: 1046.50, d: 0.4 }
                ];
                let timeOffset = 0;
                melody.forEach(item => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(item.f, now + timeOffset);
                    gain.gain.setValueAtTime(0.2, now + timeOffset);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + timeOffset + item.d);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now + timeOffset);
                    osc.stop(now + timeOffset + item.d + 0.05);
                    timeOffset += item.d;
                });
            }
        };

        function toggleSound() {
            AudioEngine.muted = !AudioEngine.muted;
            const icon = document.getElementById('soundIcon');
            const text = document.getElementById('soundText');
            if (AudioEngine.muted) {
                icon.className = 'fa-solid fa-volume-xmark text-rose-500';
                text.innerText = 'Bunyi: Off';
            } else {
                icon.className = 'fa-solid fa-volume-high text-amber-600';
                text.innerText = 'Bunyi: On';
            }
        }

        let currentQuestionIndex = 0;
        let score = 0;
        let studentName = '';
        let studentClass = '';
        let userAnswers = [];

        function shuffleArray(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function startQuiz() {
            const nameInput = document.getElementById('studentName');
            const classInput = document.getElementById('studentClass');
            const nameErr = document.getElementById('nameError');
            const classErr = document.getElementById('classError');

            let isValid = true;
            if (!nameInput.value.trim()) {
                nameErr.classList.remove('hidden');
                nameInput.classList.add('border-rose-400');
                isValid = false;
            } else {
                nameErr.classList.add('hidden');
                nameInput.classList.remove('border-rose-400');
            }

            if (!classInput.value.trim()) {
                classErr.classList.remove('hidden');
                classInput.classList.add('border-rose-400');
                isValid = false;
            } else {
                classErr.classList.add('hidden');
                classInput.classList.remove('border-rose-400');
            }

            if (!isValid) return;

            studentName = nameInput.value.trim();
            studentClass = classInput.value.trim();

            document.getElementById('displayStudentInfo').innerText = `${studentName} (${studentClass})`;

            currentQuestionIndex = 0;
            score = 0;
            userAnswers = [];

            document.getElementById('startScreen').classList.add('hidden');
            document.getElementById('quizScreen').classList.remove('hidden');

            loadQuestion();
        }

        function loadQuestion() {
            const qData = quizQuestions[currentQuestionIndex];

            document.getElementById('questionCounter').innerText = `${currentQuestionIndex + 1} / ${quizQuestions.length}`;
            const progressPercent = ((currentQuestionIndex + 1) / quizQuestions.length) * 100;
            document.getElementById('progressBar').style.width = `${progressPercent}%`;

            const imgElement = document.getElementById('questionImage');
            const imageContainer = document.getElementById('imageContainer');
            if (qData.image && qData.image.trim() !== '') {
                imgElement.src = qData.image;
                imageContainer.classList.remove('hidden');
            } else {
                imageContainer.classList.add('hidden');
            }

            document.getElementById('situationText').innerText = qData.situation;
            document.getElementById('explanationContainer').classList.add('hidden');
            document.getElementById('nextBtn').classList.add('hidden');

            const rawChoices = [qData.correctAnswer, ...qData.distractors];
            const currentShuffledOptions = shuffleArray(rawChoices);

            const optionsContainer = document.getElementById('optionsContainer');
            optionsContainer.innerHTML = '';

            const labels = ['A', 'B', 'C', 'D'];
            currentShuffledOptions.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left p-4 rounded-2xl border-2 border-slate-200 bg-white hover:bg-amber-50 hover:border-amber-300 transition-all font-medium flex items-center gap-3 btn-bounce shadow-sm";
                btn.innerHTML = `<span class="w-8 h-8 rounded-xl bg-slate-100 flex items-center justify-center font-bold text-slate-600 text-sm">${labels[idx]}</span> <span>${opt}</span>`;
                btn.onclick = () => checkAnswer(opt, btn);
                optionsContainer.appendChild(btn);
            });
        }

        function checkAnswer(selectedOpt, btn) {
            const qData = quizQuestions[currentQuestionIndex];
            const isCorrect = selectedOpt === qData.correctAnswer;

            const allBtns = document.querySelectorAll('#optionsContainer button');
            allBtns.forEach(b => b.disabled = true);

            userAnswers.push({
                question: qData.situation,
                selected: selectedOpt,
                correct: qData.correctAnswer,
                isCorrect: isCorrect
            });

            if (isCorrect) {
                score++;
                btn.classList.remove('border-slate-200', 'bg-white');
                btn.classList.add('border-emerald-500', 'bg-emerald-50', 'text-emerald-900');
                AudioEngine.playCorrect();
            } else {
                btn.classList.remove('border-slate-200', 'bg-white');
                btn.classList.add('border-rose-500', 'bg-rose-50', 'text-rose-900');
                AudioEngine.playIncorrect();

                allBtns.forEach(b => {
                    if (b.innerText.includes(qData.correctAnswer)) {
                        b.classList.remove('border-slate-200', 'bg-white');
                        b.classList.add('border-emerald-500', 'bg-emerald-50', 'text-emerald-900');
                    }
                });
            }

            const expContainer = document.getElementById('explanationContainer');
            const expIcon = document.getElementById('explanationIcon');
            const expTitle = document.getElementById('explanationTitle');
            const expText = document.getElementById('explanationText');

            expContainer.classList.remove('hidden', 'border-emerald-300', 'bg-emerald-50/80', 'border-rose-300', 'bg-rose-50/80');
            if (isCorrect) {
                expContainer.classList.add('border-emerald-300', 'bg-emerald-50/80');
                expIcon.className = "w-8 h-8 rounded-full flex items-center justify-center text-white font-bold text-sm bg-emerald-500";
                expIcon.innerHTML = '<i class="fa-solid fa-check"></i>';
                expTitle.innerText = "Jawapan Tepat!";
                expTitle.className = "font-playful font-bold text-lg text-emerald-800";
            } else {
                expContainer.classList.add('border-rose-300', 'bg-rose-50/80');
                expIcon.className = "w-8 h-8 rounded-full flex items-center justify-center text-white font-bold text-sm bg-rose-500";
                expIcon.innerHTML = '<i class="fa-solid fa-xmark"></i>';
                expTitle.innerText = "Jawapan Kurang Tepat";
                expTitle.className = "font-playful font-bold text-lg text-rose-800";
            }
            expText.innerText = qData.explanation;

            document.getElementById('nextBtn').classList.remove('hidden');
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < quizQuestions.length) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            document.getElementById('quizScreen').classList.add('hidden');
            document.getElementById('resultScreen').classList.remove('hidden');

            document.getElementById('resName').innerText = studentName;
            document.getElementById('resClass').innerText = studentClass;
            document.getElementById('resScoreText').innerText = `${score} / ${quizQuestions.length}`;

            const percent = Math.round((score / quizQuestions.length) * 100);
            document.getElementById('starBadge').innerText = `${percent}%`;

            if (percent >= 80) {
                AudioEngine.playFanfare();
                if (typeof confetti === 'function') confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
            }

            // Membina Paparan Ulasan Jawapan
            const reviewContainer = document.getElementById('reviewContainer');
            reviewContainer.innerHTML = '';
            userAnswers.forEach((ans, idx) => {
                const item = document.createElement('div');
                item.className = `p-3 rounded-xl border text-sm ${ans.isCorrect ? 'bg-emerald-50 border-emerald-200' : 'bg-rose-50 border-rose-200'}`;
                item.innerHTML = `
                    <div class="font-bold mb-1">${idx + 1}. ${ans.question}</div>
                    <div class="${ans.isCorrect ? 'text-emerald-700' : 'text-rose-700'}">Jawapan Murid: ${ans.selected} ${ans.isCorrect ? '✓' : '✗'}</div>
                    ${!ans.isCorrect ? `<div class="text-emerald-700 font-semibold">Jawapan Sebenar: ${ans.correct}</div>` : ''}
                `;
                reviewContainer.appendChild(item);
            });

            // === HANTAR REKOD KE GOOGLE SHEETS ===
            simpanKeGoogleSheet(studentName, studentClass, score, quizQuestions.length, percent);
        }

        // =========================================================
        // FUNGSI UTAMA MENYIMPAN DATA KE GOOGLE SHEETS
        // =========================================================
        function simpanKeGoogleSheet(nama, kelas, skor, total, peratus) {
            if (!GOOGLE_SHEET_URL || GOOGLE_SHEET_URL.includes("GANTIKAN_DENGAN")) {
                console.warn("URL Google Sheets belum disetkan.");
                return;
            }

            fetch(GOOGLE_SHEET_URL, {
                method: "POST",
                mode: "no-cors",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    nama: nama,
                    kelas: kelas,
                    skor: `${skor} / ${total}`,
                    peratus: `${peratus}%`
                })
            })
            .then(() => {
                console.log("Rekod murid berjaya dihantar ke Google Sheets!");
            })
            .catch(err => {
                console.error("Ralat menyimpan rekod:", err);
            });
        }

        function restartQuiz() {
            document.getElementById('resultScreen').classList.add('hidden');
            document.getElementById('startScreen').classList.remove('hidden');
            document.getElementById('studentName').value = '';
            document.getElementById('studentClass').value = '';
        }
    </script>
