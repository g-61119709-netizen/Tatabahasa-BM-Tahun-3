<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kuiz Perumpamaan Bahasa Melayu</title>
  <style>
    /* =========================================================
       GAYA APLIKASI (CSS) - Boleh diubah mengikut cita rasa anda
       ========================================================= */
    :root {
      --primary-color: #4f46e5;
      --primary-hover: #4338ca;
      --bg-color: #f3f4f6;
      --card-bg: #ffffff;
      --text-color: #1f2937;
      --correct-color: #10b981;
      --wrong-color: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background-color: var(--card-bg);
      width: 100%;
      max-width: 650px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      padding: 30px;
      position: relative;
    }

    .header-title {
      text-align: center;
      color: var(--primary-color);
      margin-bottom: 20px;
      font-size: 1.8rem;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 5px;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px;
      border: 2px solid #e5e7eb;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.3s;
    }

    input[type="text"]:focus {
      border-color: var(--primary-color);
    }

    .btn {
      width: 100%;
      background-color: var(--primary-color);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
      margin-top: 10px;
    }

    .btn:hover {
      background-color: var(--primary-hover);
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-secondary {
      background-color: #6b7280;
    }

    .btn-secondary:hover {
      background-color: #4b5563;
    }

    /* Bahagian Kuiz */
    .quiz-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      padding-bottom: 10px;
      border-bottom: 2px solid #f3f4f6;
      font-weight: 600;
    }

    .question-box {
      font-size: 1.2rem;
      font-weight: 600;
      margin-bottom: 15px;
      line-height: 1.5;
    }

    /* Gaya Gambar Soalan */
    .question-image {
      width: 100%;
      max-height: 250px;
      object-fit: contain;
      border-radius: 8px;
      margin-bottom: 15px;
      display: none;
      border: 1px solid #e5e7eb;
    }

    .options-grid {
      display: grid;
      gap: 12px;
      margin-bottom: 20px;
    }

    .option-btn {
      background-color: #f9fafb;
      border: 2px solid #e5e7eb;
      padding: 12px 16px;
      border-radius: 8px;
      text-align: left;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .option-btn:hover:not([disabled]) {
      background-color: #eff6ff;
      border-color: var(--primary-color);
    }

    .option-btn.correct {
      background-color: #d1fae5 !important;
      border-color: var(--correct-color) !important;
      color: #065f46;
      font-weight: bold;
    }

    .option-btn.wrong {
      background-color: #fee2e2 !important;
      border-color: var(--wrong-color) !important;
      color: #991b1b;
    }

    /* Kotak Penerangan */
    .explanation-box {
      background-color: #f0f9ff;
      border-left: 4px solid var(--primary-color);
      padding: 12px 16px;
      border-radius: 4px;
      margin-bottom: 15px;
      display: none;
      font-size: 0.95rem;
    }

    /* Skrin Keputusan */
    .result-box {
      text-align: center;
    }

    .score-circle {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background-color: #e0e7ff;
      color: var(--primary-color);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 2.2rem;
      font-weight: bold;
      margin: 20px auto;
    }

    .student-info-summary {
      background-color: #f9fafb;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    .status-msg {
      font-size: 0.85rem;
      color: #6b7280;
      margin-top: 5px;
    }

    .hidden {
      display: none;
    }

    @media print {
      body { background: white; }
      .btn, .header-title { display: none; }
      .container { box-shadow: none; border: none; }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- =========================================================
         1. SKRIN PENDAFTARAN MURID
         ========================================================= -->
    <div id="screen-start">
      <h1 class="header-title">Kuiz Perumpamaan Bahasa Melayu</h1>
      <p style="text-align: center; margin-bottom: 20px; color: #4b5563;">
        Sila isi maklumat diri anda sebelum mula menjawab.
      </p>
      
      <div class="form-group">
        <label for="input-nama">Nama Murid:</label>
        <input type="text" id="input-nama" placeholder="Contoh: Muhammad Ali" required>
      </div>

      <div class="form-group">
        <label for="input-kelas">Kelas:</label>
        <input type="text" id="input-kelas" placeholder="Contoh: 5 Cemerlang" required>
      </div>

      <button class="btn" onclick="startQuiz()">Mula Kuiz</button>
    </div>

    <!-- =========================================================
         2. SKRIN SOALAN KUIZ
         ========================================================= -->
    <div id="screen-quiz" class="hidden">
      <div class="quiz-header">
        <div><span id="display-nama"></span> (<span id="display-kelas"></span>)</div>
        <div>Soalan: <span id="current-question-num">1</span> / <span id="total-questions-num">10</span></div>
      </div>

      <div class="question-box" id="question-text">Teks Soalan...</div>

      <!-- Tag Gambar Soalan -->
      <img id="question-image" class="question-image" src="" alt="Gambar Soalan">

      <div class="options-grid" id="options-container">
        <!-- Pilihan jawapan diisi oleh JavaScript -->
      </div>

      <!-- Kotak Penerangan Jawapan -->
      <div class="explanation-box" id="explanation-box">
        <strong>Penerangan:</strong> <span id="explanation-text"></span>
      </div>

      <button class="btn hidden" id="btn-next" onclick="nextQuestion()">Soalan Seterusnya</button>
    </div>

    <!-- =========================================================
         3. SKRIN KEPUTUSAN & REKOD
         ========================================================= -->
    <div id="screen-result" class="hidden">
      <h1 class="header-title">Keputusan Kuiz</h1>

      <div class="student-info-summary">
        <h3><span id="result-nama"></span></h3>
        <p>Kelas: <span id="result-kelas"></span></p>
      </div>

      <div class="score-circle" id="result-score">0/10</div>
      <h2 id="result-percentage" style="margin-bottom: 10px;">0%</h2>
      <p id="result-message" style="margin-bottom: 20px; font-weight: 500;"></p>

      <div id="save-status" class="status-msg">Menghantar keputusan ke rekod...</div>

      <div style="display: flex; gap: 10px; margin-top: 20px;">
        <button class="btn btn-secondary" onclick="window.print()">Cetak / PDF</button>
        <button class="btn btn-secondary" onclick="downloadCSV()">Muat Turun CSV</button>
      </div>

      <button class="btn" onclick="restartQuiz()" style="margin-top: 10px;">Jawab Semula</button>
    </div>
  </div>

  <!-- =========================================================
       LOGIK APLIKASI (JAVASCRIPT)
       ========================================================= -->
  <script>
    // =========================================================
    // TETAPAN GOOGLE SHEETS (Sila ganti dengan URL Web App anda)
    // =========================================================
    const GOOGLE_SHEET_URL = "GANTIKAN_DENGAN_URL_WEB_APP_GOOGLE_ANDA";

    // =========================================================
    // SENARAI SOALAN, GAMBAR & PENERANGAN
    // (Boleh diubah suai pautan gambar & soalan di sini)
    // =========================================================
    const questionsData = [
      {
        question: "Amir dan adiknya sering bertengkar dan tidak pernah duduk secara aman setiap kali berjumpa di rumah. Keadaan mereka disamakan seperti:",

      {

        // === EDIT PAUTAN GAMBAR SOALAN 2 DI SINI ===
        image: "https://placehold.co/600x300/e0f2fe/0284c7?text=Gambar+Soalan+2",
        options: [
          "Seperti burung dalam sangkar",

        ],

      },
      {
        question: "Aina dan Mei Ling merupakan sahabat karib yang sangat rapat dan sukar dipisahkan sejak dari tadika lagi. Hubungan mereka amat erat seperti:",
        // === EDIT PAUTAN GAMBAR SOALAN 3 DI SINI ===
        image: "https://placehold.co/600x300/fce7f3/db2777?text=Gambar+Soalan+3",
        options: [
          "Seperti isi dengan kuku",
          "Seperti mencurah air ke daun keladi",
          "Seperti anjing dengan kucing",
          "Seperti cacing kepanasan"
        ],
        answerIndex: 0,
        explanation: "Perumpamaan 'Seperti isi dengan kuku' bermaksud hubungan persahabatan yang sangat erat."
      },
      {
        question: "Haikal kelihatan amat gelisah dan tidak boleh duduk diam di kerusinya kerana sedang menunggu keputusan ujian. Keadaan Haikal ini disamakan:",
        // === EDIT PAUTAN GAMBAR SOALAN 4 DI SINI ===
        image: "https://placehold.co/600x300/dcfce7/16a34a?text=Gambar+Soalan+4",
        options: [
          "Bagai aur dengan tebing",
          "Seperti cacing kepanasan",
          "Seperti ayam betina bertelur",
          "Seperti katak di bawah tempurung"
        ],
        answerIndex: 1,
        explanation: "Perumpamaan 'Seperti cacing kepanasan' bermaksud keadaan seseorang yang amat gelisah dan tidak tenang."
      },
      {
        question: "Setelah menjadi kaya di bandar, Daniel tidak mahu lagi mengaku ibunya yang miskin di kampung. Sikap Daniel yang tidak mengenang jasa ini dikaitkan dengan perumpamaan:",
        // === EDIT PAUTAN GAMBAR SOALAN 5 DI SINI ===
        image: "https://placehold.co/600x300/fef3c7/d97706?text=Gambar+Soalan+5",
        options: [
          "Seperti kacang lupakan kulit",
          "Seperti isi dengan kuku",
          "Seperti tikus membaiki labu",
          "Seperti burung dalam sangkar"
        ],
        answerIndex: 0,
        explanation: "Perumpamaan 'Seperti kacang lupakan kulit' bermaksud orang yang lupa akan asal usul atau kebaikan orang lain."
      },
      {
        question: "Cikgu Hafiz sudah berkali-kali menasihati Daniel supaya rajin belajar, tetapi Daniel tetap malas dan tidak menghiraukannya. Perbuatan memberi nasihat kepada Daniel adalah:",
        // === EDIT PAUTAN GAMBAR SOALAN 6 DI SINI ===
        image: "https://placehold.co/600x300/e0f2fe/0284c7?text=Gambar+Soalan+6",
        options: [
          "Seperti mencurah air ke daun keladi",
          "Bagai aur dengan tebing",

          "Seperti cacing kepanasan"
        ],
        answerIndex: 0,
        explanation: "Perumpamaan 'Seperti mencurah air ke daun keladi' bermaksud memberi nasihat yang sia-sia dan tidak didengar."
      },
      {
        question: "Siti berasa sangat sedih kerana tidak dibenarkan keluar bermain dengan kawan-kawannya dan terkurung di dalam rumah sepanjang hari. Kehidupan Siti disamakan:",
        // === EDIT PAUTAN GAMBAR SOALAN 7 DI SINI ===
        image: "https://placehold.co/600x300/fce7f3/db2777?text=Gambar+Soalan+7",
        options: [
          "Seperti burung dalam sangkar",
          "Seperti ayam betina bertelur",
          "Seperti kacang lupakan kulit",
          "Seperti isi dengan kuku"
        ],
        answerIndex: 0,
        explanation: "Perumpamaan 'Seperti burung dalam sangkar' bermaksud seseorang yang hidupnya terkurung dan tidak bebas."
      },
      {
        question: "Penduduk Kampung Seri Murni sentiasa bersatu padu dan tolong-menolong membersihkan kawasan balai raya bersama-sama. Sikap mereka ini bagai:",
        // === EDIT PAUTAN GAMBAR SOALAN 8 DI SINI ===
        image: "https://placehold.co/600x300/dcfce7/16a34a?text=Gambar+Soalan+8",
        options: [
          "Bagai aur dengan tebing",
          "Seperti katak di bawah tempurung",
          "Seperti mencurah air ke daun keladi",
          "Seperti tikus membaiki labu"
        ],
        answerIndex: 0,
        explanation: "Perumpamaan 'Bagai aur dengan tebing' bermaksud hidup saling bekerjasama dan tolong-menolong."
      },
      {
        question: "Aiman cuba membaiki jam tangan adiknya yang rosak, tetapi akhirnya jam itu menjadi semakin hancur dan tidak boleh digunakan langsung. Perbuatan Aiman seperti:",
        // === EDIT PAUTAN GAMBAR SOALAN 9 DI SINI ===
        image: "https://placehold.co/600x300/fef3c7/d97706?text=Gambar+Soalan+9",
        options: [
          "Seperti tikus membaiki labu",
          "Seperti anjing dengan kucing",
          "Seperti cacing kepanasan",
          "Seperti burung dalam sangkar"
        ],
        answerIndex: 0,
        explanation: "Perumpamaan 'Seperti tikus membaiki labu' bermaksud cuba membaiki barang yang rosak tanpa keahlian hingga menjadikannya semakin rosak."
      },
      {
        question: "Mak Senah riuh memberitahu semua jiran di kampung tentang hadiah kecil yang dimenanginya dalam cabutan bertuah. Sikap Mak Senah disamakan:",
        // === EDIT PAUTAN GAMBAR SOALAN 10 DI SINI ===
        image: "https://placehold.co/600x300/e0f2fe/0284c7?text=Gambar+Soalan+10",
        options: [
          "Seperti ayam betina bertelur",
          "Seperti isi dengan kuku",
          "Bagai aur dengan tebing",
          "Seperti kacang lupakan kulit"
        ],
        answerIndex: 0,
        explanation: "Perumpamaan 'Seperti ayam betina bertelur' bermaksud seseorang yang membuat bising setelah mendapat keuntungan yang sedikit."
      }
    ];

    // =========================================================
    // PEMINDAH WAMBANG & PEMUAT AUDIO (Web Audio API)
    // =========================================================
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playSound(type) {
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === 'correct') {
        // Bunyi ceria (chime)
        osc.type = 'sine';
        osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
        osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1); // E5
        osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.2); // G5
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.4);
      } else {
        // Bunyi salah (buzz)
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.3);
      }
    }

    // =========================================================
    // PEMBOCORAN VARIABEL UTAMA
    // =========================================================
    let studentName = "";
    let studentClass = "";
    let currentQuestionIndex = 0;
    let score = 0;
    let shuffledQuestions = [];

    // =========================================================
    // FUNGSI UTAMA KUIZ
    // =========================================================

    function startQuiz() {
      studentName = document.getElementById("input-nama").value.trim();
      studentClass = document.getElementById("input-kelas").value.trim();

      if (!studentName || !studentClass) {
        alert("Sila isi Nama dan Kelas terlebih dahulu!");
        return;
      }

      document.getElementById("display-nama").innerText = studentName;
      document.getElementById("display-kelas").innerText = studentClass;
      document.getElementById("total-questions-num").innerText = questionsData.length;

      // Sediakan soalan
      shuffledQuestions = questionsData.map(q => {
        // Acak pilihan jawapan tetapi kekalkan jawapan betul
        const originalCorrectText = q.options[q.answerIndex];
        const shuffledOptions = [...q.options].sort(() => Math.random() - 0.5);
        const newAnswerIndex = shuffledOptions.indexOf(originalCorrectText);

        return {
          question: q.question,
          image: q.image,
          options: shuffledOptions,
          answerIndex: newAnswerIndex,
          explanation: q.explanation
        };
      });

      currentQuestionIndex = 0;
      score = 0;

      document.getElementById("screen-start").classList.add("hidden");
      document.getElementById("screen-quiz").classList.remove("hidden");

      loadQuestion();
    }

    function loadQuestion() {
      const q = shuffledQuestions[currentQuestionIndex];

      document.getElementById("current-question-num").innerText = currentQuestionIndex + 1;
      document.getElementById("question-text").innerText = q.question;

      // Pengurusan Gambar
      const imgTag = document.getElementById("question-image");
      if (q.image && q.image.trim() !== "") {
        imgTag.src = q.image;
        imgTag.style.display = "block";
      } else {
        imgTag.style.display = "none";
      }

      // Sembunyikan Penerangan & Butang Seterusnya
      document.getElementById("explanation-box").style.display = "none";
      document.getElementById("btn-next").classList.add("hidden");

      // Bina Pilihan Jawapan
      const optionsContainer = document.getElementById("options-container");
      optionsContainer.innerHTML = "";

      const labels = ["A", "B", "C", "D"];
      q.options.forEach((opt, index) => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.innerHTML = `<strong>${labels[index]}.</strong> ${opt}`;
        btn.onclick = () => checkAnswer(index, q.answerIndex, btn);
        optionsContainer.appendChild(btn);
      });
    }

    function checkAnswer(selectedIndex, correctIndex, selectedBtn) {
      const allBtns = document.querySelectorAll(".option-btn");
      allBtns.forEach(btn => btn.disabled = true);

      const q = shuffledQuestions[currentQuestionIndex];

      if (selectedIndex === correctIndex) {
        selectedBtn.classList.add("correct");
        playSound('correct');
        score++;
      } else {
        selectedBtn.classList.add("wrong");
        allBtns[correctIndex].classList.add("correct");
        playSound('wrong');
      }

      // Paparkan Penerangan
      document.getElementById("explanation-text").innerText = q.explanation;
      document.getElementById("explanation-box").style.display = "block";

      // Papar Butang Seterusnya
      document.getElementById("btn-next").classList.remove("hidden");
    }

    function nextQuestion() {
      currentQuestionIndex++;
      if (currentQuestionIndex < shuffledQuestions.length) {
        loadQuestion();
      } else {
        showResults();
      }
    }

    function showResults() {
      document.getElementById("screen-quiz").classList.add("hidden");
      document.getElementById("screen-result").classList.remove("hidden");

      document.getElementById("result-nama").innerText = studentName;
      document.getElementById("result-kelas").innerText = studentClass;

      const total = shuffledQuestions.length;
      const percentage = Math.round((score / total) * 100);

      document.getElementById("result-score").innerText = `${score}/${total}`;
      document.getElementById("result-percentage").innerText = `${percentage}%`;

      let msg = "";
      if (percentage >= 80) msg = "Tahniah! Cemerlang!";
      else if (percentage >= 50) msg = "Bagus! Teruskan Usaha!";
      else msg = "Jangan Putus Asa, Cuba Lagi!";

      document.getElementById("result-message").innerText = msg;

      // Hantar data ke Google Sheets
      sendToGoogleSheets(studentName, studentClass, score, total, percentage);
    }

    function sendToGoogleSheets(nama, kelas, skor, total, peratus) {
      const statusDiv = document.getElementById("save-status");

      if (!GOOGLE_SHEET_URL || GOOGLE_SHEET_URL.includes("GANTIKAN_DENGAN")) {
        statusDiv.innerText = "Nota: Rekod tidak dihubungkan ke Google Sheets (URL belum ditetapkan).";
        return;
      }

      statusDiv.innerText = "Sedang menyimpan rekod...";

      fetch(GOOGLE_SHEET_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          nama: nama,
          kelas: kelas,
          skor: `${skor}/${total}`,
          peratus: `${peratus}%`
        })
      })
      .then(() => {
        statusDiv.innerText = "✓ Rekod berjaya disimpan ke pangkalan data Google Sheets!";
        statusDiv.style.color = "#10b981";
      })
      .catch(error => {
        statusDiv.innerText = "Ralat semasa menyimpan rekod.";
        statusDiv.style.color = "#ef4444";
      });
    }

    function downloadCSV() {
      const total = shuffledQuestions.length;
      const percentage = Math.round((score / total) * 100);
      const csvContent = "data:text/csv;charset=utf-8," 
        + "Nama Murid,Kelas,Skor,Peratus,Tarikh\n"
        + `"${studentName}","${studentClass}","${score}/${total}","${percentage}%","${new Date().toLocaleDateString()}"`;

      const encodedUri = encodeURI(csvContent);
      const link = document.createElement("a");
      link.setAttribute("href", encodedUri);
      link.setAttribute("download", `Keputusan_${studentName}_${studentClass}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    function restartQuiz() {
      document.getElementById("screen-result").classList.add("hidden");
      document.getElementById("screen-start").classList.remove("hidden");
      document.getElementById("input-nama").value = "";
      document.getElementById("input-kelas").value = "";
    }
  </script>
